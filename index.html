<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Accueil</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/accueil.css"
    >
    
    <!--
        Ce script est exécuté AVANT l'affichage
        de la page.

        Il permet de savoir immédiatement
        si cette page arrive après une transition.
    -->
    <script>

        if (
            sessionStorage.getItem("page-transition") === "true"
        ) {

            document.documentElement.classList.add(
                "transition-in"
            );

        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>






</head>


<body>


    <!-- ==================================================
         TRANSITION
    ================================================== -->

<div class="page-transition">

    <div class="page-transition-panel">

        <span class="page-transition-name">
            ΑΛΕΞΑΝΔΡΟΣ ΜΑΙΓΝΑΝ
        </span>

    </div>

</div>


    <!-- ==================================================
         NAVBAR
    ================================================== -->

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            Alexandre Maignan
        </a>


        <nav class="navbar-links">

            <a
                href="index.html"
                class="page-link"
            >
                Accueil
            </a>

            <a
                href="index.html"
                class="page-link"
            >
                Dessins
            </a>

            <a
                href="index.html"
                class="page-link"
            >
                Sculptures
            </a>


            <a
                href="about.html"
                class="page-link"
            >
                À propos
            </a>

        </nav>

    </nav>







    <!-- ==================================================
         MAIN
    ================================================== -->

    <main>



    <header class="hero">

        <div class="hero-content">

            <div class="hero-title-wrapper">
                <h1 class="hero-title">
                    Alexandre Maignan
                </h1>
            </div>

            <div class="hero-subtitle-wrapper">
                <p class="hero-subtitle">
                    Portfolio
                </p>
            </div>

        </div>

    </header>




    </main>


    <script src="js/transition.js"></script>




     <script>


        /* ==================================================
           NAVBAR
        ================================================== */

        const navbar =
            document.querySelector(".navbar");


        gsap.set(navbar, {

            mixBlendMode: "difference",

            color: "#ffffff"

        });


       

    </script>















<script>

    /* ==================================================
       HERO — TEXT REVEAL
    ================================================== */

    const heroTitle = document.querySelector(".hero-title");
    const heroSubtitle = document.querySelector(".hero-subtitle");

    const heroTimeline = gsap.timeline();

    heroTimeline
        .to(heroTitle, {
            y: 0,
            opacity: 1,
            duration: 1.4,
            ease: "power4.out"
        })
        .to(heroSubtitle, {
            y: 0,
            opacity: 1,
            duration: 1.1,
            ease: "power4.out"
        }, "-=0.9");

</script>






<script src="js/lenis.min.js"></script>
<script src="js/smooth-scroll.js"></script>





</body>

</html>
