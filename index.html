<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Footer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & global styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
    }

    /* Footer styles */
    footer {
      background-color: #9a7b6c;
      color: white;
      padding: clamp(40px, 10vw, 80px) 40px 30px 40px;
    }

    /* Footer container & columns */
    .footer-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: auto;
    }

    .footer-column {
      flex: 1;
      min-width: 0;
    }

    .footer-column:first-child {
      flex: 2;
    }

    .footer-column h3 {
      margin-bottom: 2rem;
      font-size: 22px;
    }

    .footer-column p {
      color: white;
      font-size: 14px;
      max-width: 350px;
      margin-bottom: 1.2rem;
      padding-right: 15px;
    }

    .footer-column a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 1.2rem;
      opacity: 0.6;
      transition: opacity 0.2s ease-in-out;
    }

    .footer-column a:hover {
      opacity: 1;
    }

    /* Footer bottom */
    .footer-bottom {
      border-top: 2px solid white;
      margin-top: 60px;
      text-align: left;
    }

    .footer-logo {
      font-family: 'Open Sans', sans-serif;
      font-weight: bold;
      font-size: clamp(3rem, 12vw, 8rem);
      margin-top: 20px;
    }

    .footer-copy {
      font-size: 13px;
      opacity: 0.6;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      footer {
        padding: 40px 40px 20px 40px;
      }

      .footer-column {
        flex: 1 1 calc(50% - 10px);
      }

      .footer-column:first-child {
        flex: 1 1 calc(50% - 10px);
      }

      .footer-column p {
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <footer>
    <div class="footer-container">
      <div class="footer-column">
        <h3>Sculteia.</h3>
        <p>Sculteia est un blog de sculpture, permettant également de servir comme portfolio pour mes prochaines créations.</p>
      </div>

      <div class="footer-column">
        <h3>Contact.</h3>
        <a href="mailto:alex.maignan@gmail.com">alex.maignan@gmail.com</a>
      </div>

      <div class="footer-column">
        <h3>Navigation.</h3>
        <a href="#">Accueil</a>
        <a href="#">Galerie</a>
        <a href="#">Articles</a>
        <a href="#">Blog</a>
      </div>

      <div class="footer-column">
        <h3>Réseaux sociaux.</h3>
        <a href="#">Instagram</a>
        <a href="#">LinkedIn</a>
      </div>
    </div>

    <div class="footer-bottom">
      <div class="footer-logo">ΣΚΟΥΛΤΕΙΑ.</div>
      <div class="footer-copy">© 2026 Sculteia, tous droits réservés.</div>
    </div>
  </footer>
</body>
</html>
